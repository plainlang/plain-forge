name: publish

# This workflow owns both paths onto npm:
#
#   * A published GitHub Release tagged `vX.Y.Z` ships that version to the
#     `latest` dist-tag. The tag is the source of truth for the version —
#     nothing is committed back to the repository.
#   * A merge into main ships a prerelease to the `next` dist-tag, versioned
#     from the current `latest` plus the commit sha. `latest` is never touched
#     by this path, so ordinary `npx plain-forge` users never see a prerelease.
#
# Auth is OIDC (npm trusted publishing) — no NPM_TOKEN secret. The trusted
# publisher is configured on npmjs.com against this repo and this exact
# workflow filename (publish.yml), which is why the prerelease job lives here
# rather than in a file of its own: a new filename would not be trusted and
# would need a second publisher entry on npmjs.com.
on:
  release:
    types: [published]
  push:
    branches: [main]

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # A release builds from its tag; a merge builds from the merge commit.
      REF: ${{ github.event.release.tag_name || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Notify Slack (tests failed)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: \`$REF\` halted — tests FAILED :x:. Nothing was published to npm. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

  publish:
    name: Publish to npm
    needs: test
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    # Records the release under Deployments → npm, the same way scripts/deploy.sh
    # does when publishing from a workstation.
    environment:
      name: npm
      url: https://www.npmjs.com/package/plain-forge
    permissions:
      contents: read       # read the tagged tree
      id-token: write      # OIDC token for trusted publishing

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24      # LTS; npm trusted publishing needs >= 22.14
          cache: npm

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Bundle pyro's render-spec skill
        id: pyro
        run: ./scripts/bundle-pyro.sh

      # forge/skills/render-spec is gitignored, so prove npm still packs it
      # rather than shipping a package without the renderer.
      - name: Check the bundled skill is in the package
        run: |
          npm pack --dry-run --json \
            | jq -e '.[0].files[] | select(.path == "forge/skills/render-spec/SKILL.md")' >/dev/null \
            || { echo "::error::forge/skills/render-spec is missing from the npm package"; exit 1; }

      - name: Read the version from the release tag
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a semver release tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse if this version is already on npm
        run: |
          if npm view "plain-forge@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::plain-forge@${{ steps.pkg.outputs.version }} is already published — tag a new version"
            exit 1
          fi

      # The tag decides the version, so it is applied here in the runner only
      # and never committed back to the repository.
      - name: Set the package version to match the tag
        run: npm version "${{ steps.pkg.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Notify Slack (start)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: release \`v${{ steps.pkg.outputs.version }}\` published by *${{ github.actor }}* — shipping to npm...\"}"

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived npm token. Provenance is attached automatically.
      # Pre-releases go out under the `next` dist-tag so `latest` stays stable.
      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Notify Slack (success)
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: \`v${{ steps.pkg.outputs.version }}\` published to npm :white_check_mark: (bundles pyro \`${{ steps.pyro.outputs.version }}\`). Install with \`npx plain-forge@latest update\`.\"}"

      - name: Notify Slack (failure)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: publishing \`${{ github.event.release.tag_name }}\` to npm FAILED :x:. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

  # ---------------------------------------------------------------------------
  # Merge into main -> prerelease on the `next` dist-tag.
  #
  # Runs in this file, not a file of its own, because npm's trusted publisher is
  # bound to this exact filename. See the header comment.
  prerelease:
    name: Publish prerelease to npm
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # The same environment the release path uses, so OIDC sees identical claims
    # whether or not the trusted publisher pins an environment. It carries no
    # protection rules, so this never waits for an approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/plain-forge/v/next
    permissions:
      contents: read
      id-token: write      # OIDC token for trusted publishing

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22      # trusted publishing needs >= 22.14
          cache: npm

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Bundle pyro's render-spec skill
        id: pyro
        run: ./scripts/bundle-pyro.sh

      - name: Check the bundled skill is in the package
        run: |
          npm pack --dry-run --json \
            | jq -e '.[0].files[] | select(.path == "forge/skills/render-spec/SKILL.md")' >/dev/null \
            || { echo "::error::forge/skills/render-spec is missing from the npm package"; exit 1; }

      # package.json on main is stale by design, so the published `latest` is
      # the only reliable base. Bump its patch and append the commit sha: the
      # prerelease therefore sits below the release it anticipates, and names
      # the commit it was built from.
      - name: Derive the prerelease version
        id: pre
        run: |
          BASE="$(npm view plain-forge version)"
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest on npm is '$BASE', which is not a plain X.Y.Z release — refusing to guess the next version"
            exit 1
          fi
          MAJOR="${BASE%%.*}"
          REST="${BASE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-next.${GITHUB_SHA:0:7}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest is $BASE — publishing $VERSION"

      # A re-run of the same commit derives the same version, and npm refuses to
      # overwrite. Detect that and no-op instead of failing the run red.
      - name: Skip if this commit was already published
        id: guard
        run: |
          if npm view "plain-forge@${{ steps.pre.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::plain-forge@${{ steps.pre.outputs.version }} is already on npm — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Applied in the runner only, never committed back — same as the release
      # path.
      - name: Set the package version
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: npm version "${{ steps.pre.outputs.version }}" --no-git-tag-version --allow-same-version

      # `--tag next` is what keeps `latest` stable: without it npm would point
      # `latest` at this prerelease and every `npx plain-forge` would get it.
      - name: Publish under the `next` dist-tag
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: npm publish --access public --tag next

      - name: Summarize
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: |
          {
            echo "### Prerelease published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ steps.pre.outputs.version }}\` |"
            echo "| dist-tag | \`next\` |"
            echo "| \`latest\` still | \`${{ steps.pre.outputs.base }}\` |"
            echo "| pyro | \`${{ steps.pyro.outputs.version }}\` |"
            echo
            echo "Try it: \`npx plain-forge@next install\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack (published)
        if: ${{ steps.guard.outputs.skip == 'false' && success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: prerelease \`${{ steps.pre.outputs.version }}\` published to npm :package: (bundles pyro \`${{ steps.pyro.outputs.version }}\`). Try it with \`npx plain-forge@next install\`. \`latest\` is untouched at \`${{ steps.pre.outputs.base }}\`. From <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${GITHUB_SHA:0:7}> by *${{ github.actor }}*.\"}"

      # A re-run of an already-published commit is a no-op, not a publish, so it
      # gets its own quiet line rather than claiming something shipped.
      - name: Notify Slack (nothing to publish)
        if: ${{ steps.guard.outputs.skip == 'true' && success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: prerelease \`${{ steps.pre.outputs.version }}\` was already on npm — nothing published. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

      - name: Notify Slack (failure)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*plain-forge*: prerelease of \`${GITHUB_SHA:0:7}\` FAILED :x:. \`latest\` is unaffected. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

  # Release pipelines to be turned on only after the rest of the infrastructure
  # is ready.
  #
  # # Its own job: the publish job holds id-token: write for trusted publishing, and
  # # recording a release needs none of it.
  # linear-release:
  #   name: Record release in Linear
  #   needs: publish
  #   runs-on: ubuntu-latest
  #
  #   permissions:
  #     contents: read
  #
  #   env:
  #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  #
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         ref: ${{ github.event.release.tag_name }}
  #         # The scan needs full history.
  #         fetch-depth: 0
  #
  #     # Non-fatal: the package is already on npm.
  #     - name: Record release in Linear
  #       id: linear
  #       continue-on-error: true
  #       uses: linear/linear-release-action@0a25abab892a91062ebf42260dbb2ce6277aa205 # v0.16.0
  #       with:
  #         access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
  #         version: ${{ github.event.release.tag_name }}
  #         # Pin the CLI the action downloads, not just the action.
  #         cli_version: v0.16.0
  #
  #     # continue-on-error keeps the job green, so this checks the step's own
  #     # outcome — `failure()` would never fire.
  #     - name: Notify Slack (release not recorded)
  #       if: ${{ steps.linear.outcome == 'failure' && env.SLACK_WEBHOOK_URL != '' }}
  #       run: |
  #         curl -s -X POST "$SLACK_WEBHOOK_URL" \
  #           -H 'Content-type: application/json' \
  #           --data "{\"text\":\"*plain-forge*: \`${{ github.event.release.tag_name }}\` is on npm, but recording it in Linear FAILED :warning:. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"
